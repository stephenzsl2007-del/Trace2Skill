  "allowed_tools": ["taskflow", "create_trial", "read_public_result", "submit_observation"],
  "permissions": {"fixture_read": false, "fixture_write": false, "trace_read": true, "skill_write": false, "validator_private_read": false, "registry_write": false}
}
